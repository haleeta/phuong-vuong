     Máy tính: 2 trang 1 lần, lật quanh gáy. Điện thoại: 1 trang 1 lần. Mở thẳng 1 ảnh: album/#07.
     Build: build-v3.py chép file này thành _site/album/index.html (thay 30). -->
<style>
:root{--paper:#f9f6f0;--ink:#6e1a1f;--mut:#8a6a64;--stage:#6a161b;--velvet:#5a0d0d;--velvet-d:#3d0808;
  --bod:'Cormorant Garamond',Garamond,serif;--mono:'Noto Serif',Georgia,serif;
  --pw:420px;--ph:600px;--ease:cubic-bezier(.45,.05,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,#7a1c21 0%,var(--stage) 55%,#4a0e12 100%);color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
/* Hailee 25/11: điện thoại cầm dọc KHÔNG ép xoay ngang nữa, xem từng trang một, khổ dọc 9:16 (.single) */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
.top{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,36px);z-index:20;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.top a,.top button{text-decoration:none}
.top a:hover,.top button:hover{text-decoration:underline;text-underline-offset:4px}
.top{color:var(--ink);z-index:20;pointer-events:none}.top a,.top button{pointer-events:auto;color:#f2ece1;font:400 9px var(--mono);letter-spacing:.22em;text-transform:uppercase;padding:10px 2px;border:0}
.top a:hover,.top button:hover{opacity:.7;text-decoration:none}
.top .nm{display:none}
.bot{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;height:38px;padding:0 4px;background:#f6f1e7;border-radius:999px;box-shadow:0 8px 22px -10px rgba(61,8,8,.55);display:flex;align-items:center;justify-content:center;gap:6px;z-index:20}
.arr{width:34px;height:34px;border:0;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,opacity .2s}
.arr:hover:not(:disabled){background:rgba(110,26,31,.1);color:var(--ink)}

.arr svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}
.cnt{min-width:8ch;text-align:center;font:400 10.5px var(--mono);letter-spacing:.22em;color:var(--ink)}
.hint{position:absolute;left:0;right:0;bottom:56px;z-index:21;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);transition:opacity .6s;pointer-events:none}
.stage{position:absolute;inset:0 0 56px;display:flex;align-items:center;justify-content:center;perspective:2600px}
.stk{position:absolute;top:0;width:50%;height:100%;background:#f6f1e7;pointer-events:none;transform:translateZ(-2px);transition:box-shadow .9s var(--ease)}
.stk.l{left:0}.stk.r{left:50%}
.single .stk{display:none}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);transition:transform .9s var(--ease);transform-style:preserve-3d}
.single .book{width:var(--pw)}
.book.noanim,.book.noanim .leaf{transition:none!important}
.book.closed:before{display:none}
.book:before{content:"";position:absolute;inset:auto 4% -24px 4%;height:36px;background:radial-gradient(closest-side,rgba(0,0,0,.25),transparent);filter:blur(6px);z-index:-1}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s var(--ease);cursor:pointer}
.single .leaf{left:0;width:100%}
.leaf.flip{transform:rotateY(-180deg)}
.stage{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.stage.dragging{cursor:grabbing}
.stage img{-webkit-user-drag:none;pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden;container-type:size}
.face.b{transform:rotateY(180deg)}
/* mặt giấy đang quay đi thì không bắt chuột (nếu không, bấm trúng ảnh của trang khuất) */
.leaf.flip .face.f,.leaf:not(.flip) .face.b{pointer-events:none}
.face:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9}
.face.f:after{background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,.04) 5%,transparent 11%)}
.face.b:after{background:linear-gradient(270deg,rgba(0,0,0,.16),rgba(0,0,0,.04) 5%,transparent 11%)}
.single .face.f:after{background:linear-gradient(90deg,rgba(0,0,0,.10),transparent 6%)}
.shade{position:absolute;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .5s ease}
.f .shade{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 70%)}
.b .shade{background:linear-gradient(270deg,rgba(0,0,0,.18),transparent 70%)}
.leaf.turning .shade{opacity:1}
.curl{position:absolute;right:0;bottom:0;width:0;height:0;z-index:11;background:linear-gradient(135deg,var(--paper) 45%,#cfccc5 50%,#ebe9e4 62%);box-shadow:-4px -4px 10px -4px rgba(0,0,0,.22);transition:width .35s var(--ease),height .35s var(--ease)}
.leaf.cur .f .curl{width:30px;height:30px}
.leaf.cur:hover .f .curl{width:58px;height:58px}
/* Dàn trang theo ref Hailee 25/11 (zine thời trang tối giản): giấy trắng nhiều khoảng trống, ảnh nhiều cỡ đặt lệch,
   dải ảnh chồng như chụp liên tiếp, số trang + chú thích rất nhỏ. Đo theo khổ trang (cqw/cqh). Chữ chỉ có tên, ngày, số ảnh. */
.m{position:absolute;font:400 max(8px,min(1.5cqw,1.35cqh))/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);z-index:6}
.pn{position:absolute;font:600 max(9px,min(1.7cqw,1.5cqh)) var(--mono);color:var(--ink);z-index:6}
.vt{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);font:400 max(7px,min(1.3cqw,1.15cqh))/1.5 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);z-index:6}
.ph{position:absolute;overflow:hidden;background:#ece6dc;z-index:4}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 12%;opacity:0;transition:opacity .6s}
/* khung ảnh hẹp hơn ảnh gốc thì giữ phần đầu: không bao giờ cắt mặt, cắt đầu (Hailee 25/11) */
.ph img{transform-origin:50% 12%}
.ph img.ok{opacity:1}
.ph{cursor:zoom-in}.ph img{transition:opacity .6s,transform .7s var(--ease)}
@media (hover:hover){.ph:hover img{transform:scale(1.045)}}
.ph.act img{transform:scale(1.045)}
.lb{position:absolute;inset:0;z-index:50;background:rgba(26,6,6,.96);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.lb.on{opacity:1;visibility:visible}
.lb img{max-width:calc(100% - 120px);max-height:calc(100% - 90px);object-fit:contain;transform:scale(.96);transition:transform .45s var(--ease),opacity .25s;user-select:none;-webkit-user-drag:none}
.lb.on img{transform:none}
.lb button{position:absolute;color:#f2ece1;font:400 12px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.lb .x{top:14px;right:18px;width:48px;height:48px;font-size:30px;letter-spacing:0;line-height:1}.lb .pv,.lb .nx{top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:28px;letter-spacing:0}
.lb .pv{left:10px}.lb .nx{right:10px}
.lb .c{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#f2ece1;font:400 11px var(--mono);letter-spacing:.16em}
@media (max-width:900px){.lb img{max-width:calc(100% - 88px)}.lb .pv,.lb .nx{width:40px}}
.bw img{filter:grayscale(1)}
/* bìa (Hailee 25/11 chọn kiểu B): nét vẽ bàn tiệc cô dâu chú rể của thiệp làm key visual, chữ theo đúng hệ chữ của thiệp */
.cover{background:#f6f1e7;color:var(--ink);text-align:center}  /* Hailee 25/11 chọn bìa C: kiểu bìa sách Pháp, không ảnh, nét vẽ thiệp thu nhỏ */
.cover:after{display:block;background:linear-gradient(90deg,rgba(60,40,20,.10),rgba(60,40,20,.02) 1.2%,transparent 2.4%,rgba(60,40,20,.07) 3%,transparent 4%)}
.cover .nm{position:absolute;left:0;right:0;top:12.5cqh;font:400 min(4.6cqw,3.7cqh)/1.15 'Great Vibes',cursive;color:var(--ink)}
.cover .cl{position:absolute;left:0;right:0;top:23cqh;font:500 max(7px,min(.9cqw,.73cqh)) var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#444}
.cover svg{position:absolute;left:8.5cqw;width:83cqw;bottom:calc(10.6cqh + 1.4cqh);height:auto}  /* Hailee 25/11: nét vẽ rộng bằng đường viền đỏ, đặt sát viền dưới (viewBox ôm sát nét vẽ) */
.cover .rl{position:absolute;left:8.5cqw;right:8.5cqw;bottom:10.6cqh;height:4px;border-top:1.6px solid var(--ink);border-bottom:.6px solid var(--ink)}
.cover .rl.t{bottom:auto;top:7cqh;border-top:.6px solid var(--ink);border-bottom:1.6px solid var(--ink)}  /* Hailee 25/11 chọn viền A: nét đậm + nét mảnh, đậm quay ra mép */  /* Hailee 25/11: bìa có 2 viền đỏ trên + dưới như ref Lyotard / Galilée */
.cover .ft{position:absolute;left:8.6cqw;right:8.6cqw;bottom:7.6cqh;display:flex;justify-content:space-between;font:500 max(7px,min(.78cqw,.63cqh)) var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#222}
/* trang tên: chữ lớn mảnh góc trên trái */
.title .t{position:absolute;left:0;right:0;top:42cqh;text-align:center;font:italic 400 max(13px,min(2.07cqw,1.67cqh))/1.35 var(--bod);color:var(--ink)}  /* Hailee 25/11: Great Vibes xấu → cùng chữ nghiêng với bìa */
.title .d{position:absolute;left:0;right:0;bottom:7cqh;text-align:center;font:400 max(7px,min(.8cqw,.7cqh)) var(--mono);letter-spacing:.28em;color:var(--ink)}
.title .m{left:0;right:0;text-align:center;bottom:7cqh}
/* dải ảnh chồng như chụp liên tiếp */
.seq .strip{position:absolute;left:7cqw;width:66cqw;top:57cqh;height:min(26cqh,30cqw)}
.seq .strip{display:flex;gap:max(4px,.8cqw)}
.seq .strip .ph{position:relative;flex:1 1 0;height:100%;transition:flex-grow .55s var(--ease)}
@media (hover:hover){.seq .strip .ph:hover{flex-grow:1.5}}
.seq .strip .ph.act{flex-grow:1.5}
.seq .pn{left:7cqw;top:calc(57cqh - 4.5cqh)}
.seq .m{left:7cqw;top:calc(57cqh + min(26cqh,30cqw) + 2cqh)}
/* ảnh nửa trên trang, phần dưới trắng */
.half .ph{left:0;right:0;top:0;height:52cqh}
.half .vt{right:3.5cqw;bottom:4cqh}
/* ảnh có lề ở nửa trên, số trang + chú thích bên dưới */
.topm .ph{left:7cqw;right:7cqw;top:7cqh;height:46cqh}
.topm .pn{top:57cqh}.topm.b .pn{left:7cqw}.topm.f .pn{right:7cqw}
.topm .m{top:61cqh}.topm.b .m{left:7cqw}.topm.f .m{right:7cqw;text-align:right}
/* đối xứng: ảnh nhỏ cạnh ảnh vừa (trang trái), lật gương ở trang phải; xếp hàng, không chồng; rê/chạm thì ảnh nở ra */
.row{position:absolute;display:flex;align-items:center;gap:max(6px,1.6cqw)}
.row .ph{position:relative;transition:flex-grow .55s var(--ease),height .55s var(--ease)}
.duo .row{left:9cqw;right:9cqw;top:22cqh;height:50cqh}
.duo.f .row{flex-direction:row-reverse}
.duo .p1{flex:.55 1 0;height:38%}.duo .p2{flex:1 1 0;height:100%}
@media (hover:hover){.duo .p1:hover{flex-grow:.85;height:52%}.duo .p2:hover{flex-grow:1.3}}
.duo .p1.act{flex-grow:.85;height:52%}.duo .p2.act{flex-grow:1.3}
.duo .m{top:75cqh}.duo.b .m{right:9cqw;text-align:right}.duo.f .m{left:9cqw}
/* tràn trang */
.bleed .ph{inset:0}
/* trang trắng, 2 ảnh nhỏ cạnh nhau giữa trang, rê/chạm thì ảnh nở ra */
.two .row{left:14cqw;right:14cqw;top:34cqh;height:min(32cqh,46cqw)}
.two .row .ph{flex:1 1 0;height:100%}
@media (hover:hover){.two .row .ph:hover{flex-grow:1.45}}
.two .row .ph.act{flex-grow:1.45}
.two .m{left:14cqw;top:calc(34cqh + min(32cqh,46cqw) + 2.2cqh)}
/* ảnh dọc có lề, đứng giữa */
.frame .ph{left:16cqw;right:16cqw;top:9cqh;bottom:12cqh}
.frame .m{left:16cqw;bottom:6.5cqh}
/* trang cuối: chữ nhỏ góc dưới trái như trang ghi công */
/* Hailee 25/11: tên nhỏ đi chút, cả khối tên + ngày căn giữa theo chiều cao cặp ảnh trang trái (.two .row: top 34cqh, cao min(32cqh,46cqw)) */
.end{--es:min(5.4cqw,4.8cqh);--ec:calc(34cqh + min(16cqh,23cqw))}
.end .t{position:absolute;left:0;right:0;top:calc(var(--ec) - (var(--es) * 1.2 + 4.2cqh) / 2);text-align:center;font:400 var(--es)/1.2 'Great Vibes',cursive;color:var(--ink)}
.end .m{left:0;right:0;text-align:center;top:calc(var(--ec) - (var(--es) * 1.2 + 4.2cqh) / 2 + var(--es) * 1.2 + 2cqh);letter-spacing:.32em}
.end a{position:absolute;left:50%;transform:translateX(-50%);top:calc(38cqh + min(7cqw,6.2cqh) * 1.25 + 7cqh);white-space:nowrap;z-index:12;font:italic 400 max(15px,min(2.3cqw,2.1cqh)) 'Cormorant Garamond',serif;letter-spacing:.02em;text-decoration:none;color:var(--ink);padding-bottom:.18em;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;transition:background-size .45s var(--ease),opacity .3s}  /* Hailee 25/11 chê nút khung chữ in hoa → chữ nghiêng có gạch mảnh như link tạp chí */
.end a::after{content:' \2192';font-style:normal}
.end a:hover{background-size:0 1px;background-position:100% 100%}
.backc{background:#f6f1e7}
.blank{}
/* mục lục */
.idx{position:fixed;inset:0;z-index:40;background:#f5f3ee;overflow:auto;padding:80px clamp(16px,4vw,60px) 40px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.idx.on{opacity:1;visibility:visible}
.idx h2{margin:0 0 28px;font:500 clamp(40px,7vw,84px)/1 var(--bod);color:var(--ink)}
.idx .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.idx .g button{position:relative;aspect-ratio:2/3;overflow:hidden;background:#e4e2dd}
.idx .g img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.idx .g button:hover img{transform:scale(1.04)}
.idx .g span{position:absolute;left:6px;bottom:5px;font-size:10px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
/* Hailee 25/11: nút gạt Album (lưới ảnh) / Zine (cả quyển dàn trang theo cặp trang) */
.idx .ih{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:0 0 28px}
.idx .ih h2{margin:0}
.sw{display:inline-flex;padding:3px;border:1px solid var(--ink);border-radius:999px;margin-bottom:8px}
.sw button{font:400 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);padding:8px 18px;border-radius:999px;transition:background .25s,color .25s}
.sw button.on{background:var(--ink);color:#f6f1e7}
.zv{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--zw) * 2),1fr));gap:34px 28px;--zw:clamp(130px,16vw,230px)}
.zv[hidden],.idx .g[hidden]{display:none}
.zv .sp{display:flex;justify-content:center;cursor:pointer}
.zv .zp{position:relative;width:var(--zw);height:calc(var(--zw) / var(--za,.75));overflow:hidden;box-shadow:0 10px 22px -14px rgba(40,10,10,.5)}
/* trang dựng đúng cỡ thật rồi thu nhỏ cả trang, để chữ và ảnh giữ đúng tỉ lệ (Hailee 25/11: bìa thu nhỏ bị sai tỉ lệ) */
.zv .zi{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);transform:scale(var(--zs,.3));transform-origin:0 0;container-type:size;background:var(--paper);overflow:hidden}
.zv .zp.e{background:none;box-shadow:none}
.zv .zp.b .zi{background-image:linear-gradient(270deg,rgba(0,0,0,.10),transparent 8%)}.zv .zp.f .zi{background-image:linear-gradient(90deg,rgba(0,0,0,.10),transparent 8%)}
.zv .zi.cover,.zv .zi.backc{background:#f6f1e7}
.zv .sp:hover .zp:not(.e){box-shadow:0 14px 28px -12px rgba(40,10,10,.6)}
.zv .zp img{opacity:1}
.idx .x{position:fixed;top:14px;right:clamp(12px,3vw,30px);width:48px;height:48px;font-size:30px;line-height:1;color:var(--ink)}
/* khổ trang ngang 3:2 (Hailee 25/11, ref Heyzine): ảnh gốc đều dọc 2:3 nên khung ảnh đo theo chiều cao trang (cqh), giữ dọc */
body:not(.single) .cover .nm{font-size:5.4cqh;top:13cqh}

@media (hover:hover){body:not(.single) .seq .strip .ph:hover{flex-grow:0}}
body:not(.single) .seq .pn{top:12.5cqh}body:not(.single) .seq .m{top:79cqh}

body:not(.single) .half.f .ph{left:0;right:auto}body:not(.single) .half.b .ph{right:0;left:auto}
body:not(.single) .half.f .vt{right:3.5cqw}body:not(.single) .half.b .vt{left:3.5cqw;right:auto}
/* Hailee 25/11: ảnh 9 là ảnh ngang duy nhất, khung dọc lẹm mặt → 2 trang topm đối nhau dùng khung ngang 1.6 như bản cũ */
body:not(.single) .topm .ph{top:12cqh;height:60cqh;width:96cqh}
body:not(.single) .topm.b .ph{left:7cqw;right:auto}body:not(.single) .topm.f .ph{right:7cqw;left:auto}
body:not(.single) .topm .pn{top:75cqh}body:not(.single) .topm .m{top:79cqh}

  $('.stk.r').style.visibility = cur < L ? 'visible' : 'hidden'; $('.stk.l').style.visibility = cur > 0 ? 'visible' : 'hidden';
  leaves.forEach((lf, i) => { if (single) lf.style.visibility = i >= cur - 1 && i <= cur + 1 ? '' : 'hidden'; lf.classList.toggle('flip', i < cur); lf.classList.toggle('cur', i === cur); lf.style.zIndex = i < cur ? i + 1 : L - i + 1; });
  const pw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'));
  book.style.transform = single ? '' : cur === 0 ? 'translateX(' + (-pw / 2) + 'px)' : cur === L ? 'translateX(' + (pw / 2) + 'px)' : '';
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => book.classList.remove('noanim')));
  const ns = vis().flatMap(i => pages[i] ? pages[i].p.n : []);
  $('#prev').disabled = cur === 0; $('#next').disabled = cur >= L - 1;  // Hailee 25/11: dừng ở trang cuối, không lật sang bìa sau (trông như về trang đầu)
  lazy();
  if (cur > 0 && ns.length) history.replaceState(null, '', '#' + pad(ns[0])); else history.replaceState(null, '', location.pathname);
}
// mỗi khung ảnh: phóng để cô dâu chú rể cao ~2/3 khung, đặt hai người giữa khung (Hailee 25/11); khung đổi cỡ (rê chuột, đổi màn) thì tính lại
const ZOOM = new Set([10, 11, 12, 13]);
const ZX = {13: 1.18};  // Hailee 25/11: ảnh 13 cô dâu sát mép trái gốc → phóng thêm, giữ mép trái, bớt bụi cây bên phải cho hai bên cân
function fit(ph) {
  const im = ph.querySelector('img'); if (!im || !im.naturalWidth) return;
  const W = ph.clientWidth, H = ph.clientHeight; if (!W || !H) return;
  const n = +ph.dataset.n, b = PEOPLE[n], r = im.naturalWidth / im.naturalHeight;
  if (!ZOOM.has(n)) return;  // chỉ bộ ảnh vườn Hailee bảo phóng (người cao 2/3 khung); ảnh khác giữ cách cắt cũ theo mặt
  const cover = Math.max(H, W / r);
  let h = cover;
  if (b && b[3] - b[1] < 0.6) h = Math.max(cover, Math.min(cover * 2.2, (H * 2 / 3) / (b[3] - b[1])));  // chỉ phóng ảnh người đứng nhỏ trong khung (bộ ảnh vườn)
  h *= ZX[n] || 1;  // phóng thêm riêng từng ảnh
  const w = h * r, cx = (FX[n] ?? 50) / 100, cy = FOCUS[n] / 100;
  const L = Math.min(0, Math.max(W - w, W / 2 - cx * w)), T = Math.min(0, Math.max(H - h, H * 0.36 - cy * h));  // mặt cô dâu chú rể ở khoảng 1/3 trên khung, không bao giờ cắt mặt
  Object.assign(im.style, { position: 'absolute', maxWidth: 'none', objectFit: 'fill', width: w + 'px', height: h + 'px', left: L + 'px', top: T + 'px', transformOrigin: (cx * 100) + '% ' + (cy * 100) + '%' });
}
const ro = new ResizeObserver(es => es.forEach(e => fit(e.target)));
function lazy() {
  const v = vis(), lo = Math.min(...v) - (single ? 3 : 6), hi = Math.max(...v) + (single ? 3 : 6);
  book.querySelectorAll('img[data-src]').forEach(im => {
    const lf = im.closest('.leaf'), idx = +(im.closest('.face').classList.contains('f') ? lf.dataset.f : lf.dataset.b);
    if (idx >= lo && idx <= hi) { const ph = im.closest('.ph'); ro.observe(ph); im.onload = () => { im.classList.add('ok'); fit(ph); }; im.src = im.dataset.src; im.removeAttribute('data-src'); if (im.complete) { im.classList.add('ok'); fit(ph); } }
  });
}
function go(d) {
  const n = cur + d; if (busy || n < 0 || n > leaves.length - 1) return;
  const lf = leaves[d > 0 ? cur : cur - 1];
  busy = true; lf.classList.add('turning');
  cur = n; render(false); lf.style.zIndex = 999;
  setTimeout(() => lf.classList.remove('turning'), 550);
  setTimeout(() => { busy = false; render(false); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 620);
  
}
function jumpToPhoto(n) {
  const k = pages.findIndex(x => x.p.n.includes(n)); if (k < 0) return;
  cur = single ? k : Math.ceil(k / 2); render(true); 
}
$('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
// kéo chuột / vuốt: trang giấy đi theo tay, thả quá 1/3 hoặc vuốt nhanh thì lật hẳn, không thì bật về
let swiped = false, drag = null;
const ax = e => e.clientX, ay = e => e.clientY;
let pwC = 0; const pwNow = () => pwC || (pwC = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw')));
stage.addEventListener('pointerdown', e => {
  if (busy || e.button > 0 || e.target.closest('a,button') || lb.classList.contains('on')) return;
  swiped = false; drag = { x: ax(e), y: ay(e), t: performance.now(), dir: 0, leaf: null, p: 0, id: e.pointerId };
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = ax(e) - drag.x, dy = ay(e) - drag.y;
  if (!drag.dir) {
    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
    const dir = dx < 0 ? 1 : -1, n = cur + dir;
    if (n < 0 || n > leaves.length - 1) { drag = null; return; }
    drag.dir = dir; drag.leaf = leaves[dir > 0 ? cur : cur - 1];
    drag.leaf.style.transition = 'none'; drag.leaf.style.zIndex = 999; drag.leaf.classList.add('turning');
    try { stage.setPointerCapture(drag.id); } catch (_) {}
    stage.classList.add('dragging'); swiped = true; 
  }
  drag.p = Math.max(0, Math.min(1, (-dx * drag.dir) / (pwNow() * 1.3)));
  if (!drag.raf) drag.raf = requestAnimationFrame(() => { if (!drag) return; drag.raf = 0; drag.leaf.style.transform = (single ? 'perspective(1800px) ' : '') + 'rotateY(' + (drag.dir > 0 ? -180 * drag.p : -180 * (1 - drag.p)) + 'deg)'; });  // 1 lần vẽ mỗi khung hình
});
const endDrag = e => {
  if (!drag) return; const d = drag; drag = null; if (d.raf) cancelAnimationFrame(d.raf);
  stage.classList.remove('dragging');
  if (!d.dir) return;
  const v = Math.abs(ax(e) - d.x) / Math.max(1, performance.now() - d.t);
  const commit = d.p > 0.33 || (v > 0.5 && d.p > 0.05);
  d.leaf.style.transition = ''; d.leaf.style.transform = '';
  busy = true;
  if (commit) cur += d.dir;
  render(false); d.leaf.style.zIndex = 999;
  setTimeout(() => d.leaf.classList.remove('turning'), 500);
  setTimeout(() => { busy = false; render(false); }, 650);
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
// cuộn chuột / vuốt 2 ngón trên trackpad cũng lật trang
let wAcc = 0, wLock = 0, wIdle;
stage.addEventListener('wheel', e => {
  e.preventDefault();
  if (performance.now() < wLock || busy) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  wAcc += d; clearTimeout(wIdle); wIdle = setTimeout(() => { wAcc = 0; }, 180);
  if (Math.abs(wAcc) > 45) { go(wAcc > 0 ? 1 : -1); wAcc = 0; wLock = performance.now() + 800; }
}, { passive: false });
const coarse = matchMedia('(hover:none)').matches;
book.addEventListener('click', e => {
  if (e.target.closest('a') || swiped) return;
  const pic = e.target.closest('.ph[data-n]');
  if (pic) {
    if (coarse && !pic.classList.contains('act')) { book.querySelectorAll('.ph.act').forEach(x => x.classList.remove('act')); pic.classList.add('act'); return; }
    pic.classList.remove('act'); openLb(+pic.dataset.n); return;
  }
  book.querySelectorAll('.ph.act').forEach(x => x.classList.remove('act'));
  const W = innerWidth;
  go(ax(e) < W / 2 ? -1 : 1);
});
const lb = $('#lb'), lbI = $('#lbI');
let lbN = 1;
const BWs = n => BW.has(n) ? (TONE[n] || 'grayscale(1)') : 'none';
function showLb(n) { lbN = (n + N - 1) % N + 1; lbI.style.opacity = 0; const im = new Image(); im.onload = () => { lbI.src = im.src; lbI.style.filter = BWs(lbN); lbI.alt = 'Ảnh cưới số ' + lbN; lbI.style.opacity = 1; }; im.src = 'lon/' + pad(lbN) + '.jpg'; $('#lbC').textContent = 'No. ' + pad(lbN) + ' / ' + pad(N); }
function openLb(n) { showLb(n); lb.classList.add('on'); }
const closeLb = () => lb.classList.remove('on');
$('#lbX').onclick = closeLb; $('#lbP').onclick = () => showLb(lbN - 1); $('#lbN').onclick = () => showLb(lbN + 1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
let lx = null;
lb.addEventListener('pointerdown', e => { lx = ax(e); });
lb.addEventListener('pointerup', e => { if (lx === null) return; const d = ax(e) - lx; lx = null; if (Math.abs(d) > 40) showLb(lbN + (d < 0 ? 1 : -1)); });
addEventListener('keydown', e => {
  if (lb.classList.contains('on')) { if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') showLb(lbN + 1); if (e.key === 'ArrowLeft') showLb(lbN - 1); return; }
  if ($('#idx').classList.contains('on')) { if (e.key === 'Escape') closeIdx(); return; }
  if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
});
const grid = $('#grid');
grid.innerHTML = Array.from({ length: N }, (_, i) => '<button type="button" data-n="' + (i + 1) + '"' + (BW.has(i + 1) ? ' style="filter:grayscale(1)"' : '') + '><img loading="lazy" src="nho/' + pad(i + 1) + '.jpg" alt="Ảnh ' + (i + 1) + '"><span>No. ' + pad(i + 1) + '</span></button>').join('');
function buildZine() {
  const z = $('#zv'), cs = getComputedStyle(document.documentElement), pw = parseFloat(cs.getPropertyValue('--pw')), phh = parseFloat(cs.getPropertyValue('--ph'));
  const zw = Math.max(130, Math.min(230, innerWidth * .16));
  z.style.setProperty('--zw', zw + 'px'); z.style.setProperty('--za', (pw / phh).toFixed(4)); z.style.setProperty('--zs', (zw / pw).toFixed(4));
  const L = leaves.length, pg = i => pages[i] ? html(pages[i].p, pages[i].i) : null;
  const page = (x, side) => x ? '<div class="zp ' + side + '"><div class="zi ' + side + ' ' + x.c + '">' + x.h + '</div></div>' : '<div class="zp e"></div>';
  // cặp đầu = bìa sau (trái) + bìa trước (phải) như quyển sách mở phẳng; sau đó là các cặp trang trong
  const out = ['<div class="sp" data-c="0" role="button" tabindex="0" aria-label="Bìa">' + page(pg(pages.length - 1), 'b') + page(pg(0), 'f') + '</div>'];
  for (let c = 1; c < L; c++) out.push('<div class="sp" data-c="' + c + '" role="button" tabindex="0" aria-label="Cặp trang ' + c + '">' + page(pg(c * 2 - 1), 'b') + page(pg(c * 2), 'f') + '</div>');
  z.innerHTML = out.join('');
  z.querySelectorAll('img[data-src]').forEach(im => { const ph = im.closest('.ph'); im.loading = 'lazy'; im.onload = () => { im.classList.add('ok'); fit(ph); }; ro.observe(ph); im.src = im.dataset.src; im.removeAttribute('data-src'); });
}
function view(v) {
  document.querySelectorAll('.sw button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  $('#grid').hidden = v !== 'album'; $('#zv').hidden = v !== 'zine';
  if (v === 'zine') buildZine();
}
document.querySelectorAll('.sw button').forEach(b => b.onclick = () => view(b.dataset.v));
$('#zv').addEventListener('click', e => { const sp = e.target.closest('.sp'); if (!sp) return; closeIdx(); cur = +sp.dataset.c; render(true); });
const openIdx = () => $('#idx').classList.add('on'), closeIdx = () => $('#idx').classList.remove('on');
$('#openIdx').onclick = openIdx; $('#closeIdx').onclick = closeIdx;
grid.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; closeIdx(); jumpToPhoto(+b.dataset.n); });
let rz, wasSingle = innerWidth < 760;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const ns = vis().flatMap(i => pages[i] ? pages[i].p.n : []); build(); if (ns.length) jumpToPhoto(Math.min(...ns)); }, 200); });
const h = parseInt(location.hash.slice(1), 10);
build();
if (h >= 1 && h <= N) jumpToPhoto(h);
})();
